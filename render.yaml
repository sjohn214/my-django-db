services:
  - type: web
    name: my-django-db-app
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn --pythonpath Django/django_project django_project.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DJANGO_SETTINGS_MODULE
        value: "django_project.settings"
