<!---- Visual improvement features-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Northwind DB Manager</title>
    <!-- Bootstrap 5.3 CDN -->
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="#">📊 ISM 672 DB</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-expand navbar-nav ms-auto gap-3">
                    <li class="nav-item">
                        <a class="nav-link btn btn-outline-secondary text-white px-3" href="{% url 'customer_search' %}">Find Customers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn btn-outline-secondary text-white px-3" href="{% url 'product_search' %}">Find Products</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="container min-vh-100">
        {% block content %}
        {% endblock %}
    </div>

    <footer class="bg-dark text-muted py-3 mt-5 border-top border-secondary">
        <div class="container text-center">
            <small>&copy; 2026 App Design & Programming • ISM 672</small>
        </div>
    </footer>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://jsdelivr.net"></script>
</body>
</html>
